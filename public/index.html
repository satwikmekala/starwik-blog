<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starwik — A curious traveller in the cosmos</title>
  <!-- Google Fonts: Space Grotesk for headings, Inter for body -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="galaxy-bg" class="galaxy-bg" aria-hidden="true"></div>
  <script type="module" src="galaxy.js"></script>
  <script src="script.js"></script>
  <header class="site-header">
    <div class="logo-wrap" style="--logo-mask: url(svg/starwik-logo.png);">
      <a href="/" class="logo-link" aria-label="Starwik home">
        <img src="svg/starwik-logo.png" alt="Starwik Logo" class="logo logo-img" />
      </a>
    </div>
    <p class="tagline">A curious traveller in the cosmos</p>
  </header>
  <main class="blog-main">
    <section class="blog-cards">
      <!-- Blog posts will be loaded dynamically -->
      <div style="text-align: center; color: var(--text-dim); padding: 3rem;">
        <p>Loading posts...</p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    © 2025 Starwik — All Thoughts Are Stars
  </footer>
  
</body>
</html>
